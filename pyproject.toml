[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulcan-eda-uvm"
version = "0.0.0"
description = "A UVM-based verification environment using cocotb and pyuvm"
requires-python = ">=3.10"
dependencies = [
    "cocotb == 2.1.0",
    "pyuvm == 5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools]
packages = ["vulcan_eda.uvm",
            "vulcan_eda.uvm.sequences",
            "vulcan_eda.uvm.signals",
            "vulcan_eda.uvm.configs",
            "vulcan_eda.uvm.configs.agents",
            "vulcan_eda.uvm.configs.layers",
            "vulcan_eda.uvm.configs.sequences",
            "vulcan_eda.uvm.interfaces",
            "vulcan_eda.uvm.layers",
            "vulcan_eda.uvm.drivers",
            "vulcan_eda.uvm.monitors",
            "vulcan_eda.uvm.agents",
            "vulcan_eda.uvm.scoreboards",
            "vulcan_eda.uvm.subscribers",
            "vulcan_eda.uvm.protocols.axi.mm",
            "vulcan_eda.uvm.protocols.axi.mm.configs",
            "vulcan_eda.uvm.protocols.axi.mm.data",
            "vulcan_eda.uvm.protocols.axi.mm.sequences",
            "vulcan_eda.uvm.protocols.axi.mm.subscribers",
            "vulcan_eda.uvm.protocols.axi.stream",
            "vulcan_eda.uvm.protocols.axi.stream.data",
            "vulcan_eda.uvm.protocols.axi.stream.configs",
            "vulcan_eda.uvm.protocols.axi.stream.configs.sequences",
            "vulcan_eda.uvm.protocols.axi.stream.sequences",
            "vulcan_eda.uvm.protocols.axi.stream.subscribers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
